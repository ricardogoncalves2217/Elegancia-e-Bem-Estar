    <main>
     
      <section class="heroFind">
        <div class="heroFind__bg"></div>

        <div class="heroFind__overlay"></div>

        <div class="container heroFind__content">
          <h1>Encontre o melhor cuidado<br/>de estética para si</h1>

          <form id="homeSearchForm" class="searchBar">

            <div class="miniStat"><strong>Ter–Sex</strong><span>09:00–18:00</span></div>
            <div class="miniStat"><strong>Sábado</strong><span>09:00–13:00</span></div>
            <div class="miniStat"><strong>Almoço</strong><span>13:00–14:30</span></div>

                </svg>
              </span>

            <a class="quickLink" href="marcacoes.html">

                </svg>
              </span>
              <span class="quickLink__title">Marcações</span>
              <span class="quickLink__text">Calendário</span>
            </a>

            <a class="quickLink" href="sobre.html">

                  <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="1.6"/>

                </svg>
              </span>
              <span class="quickLink__title">Sobre nós</span>

    <div id="site-footer"></div>
  </div>

  <script src="assets/js/components.js"></script>
  <script type="module" src="assets/js/auth-ui.js"></script>

  <script type="module">
    import { services } from "./assets/js/services-data.js";

    const procedure = document.getElementById("procedure");
    const form = document.getElementById("homeSearchForm");

    if (procedure && Array.isArray(services)) {
      const sorted = [...services].sort((a,b) => (a.nome||"").localeCompare(b.nome||""));
      procedure.innerHTML =
        `<option value="">Escolha um serviço...</option>` +
        sorted.map(s => `<option value="${s.id}">${s.nome}</option>`).join("");
    }

    form?.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = procedure?.value;
      if (!id) location.href = "servicos.html";
      else location.href = `marcacoes.html?servico=${encodeURIComponent(id)}`;
    });
  </script>
</body>
</html>
